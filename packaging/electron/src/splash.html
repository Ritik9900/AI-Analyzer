<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'" />
    <title>Portfolio Analyzer</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: linear-gradient(135deg, #1d4f91, #0b1730); color: #fff;
        font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-app-region: drag; user-select: none;
      }
      img { width: 72px; height: 72px; }
      h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: .01em; }
      p { margin: 0; font-size: 12px; opacity: .75; }
      .bar { width: 160px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.18); overflow: hidden; }
      .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #38bdf8; animation: slide 1.2s ease-in-out infinite; }
      @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <img src="icon.png" alt="" />
    <h1>Portfolio Analyzer</h1>
    <div class="bar" role="progressbar" aria-label="Starting"></div>
    <p>Starting the analysis engine…</p>
  </body>
</html>
